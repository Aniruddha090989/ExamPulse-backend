spring.application.name=OnlineExam

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=${PORT:8080}

# CORS configuration
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=false
app.cors.max-age=3600

# JWT secret
jwt.secret=${JWT_SECRET}

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never














logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.example.OnlineExam=DEBUG
